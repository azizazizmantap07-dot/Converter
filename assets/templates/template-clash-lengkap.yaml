port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
keep-alive-interval: 30
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "dlg.io.mi.com"
    - "+.apple.com"

dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.localhost"
    - "+.invalid"
    - "+.home.arpa"
    - "+.ntp.org"
    - "ntp.*.com"
    - "time.*.com"
    - "time.*.apple.com"
    - "time.android.com"
    - "time.windows.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
    - "stun.*.*.*"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
    - "detectportal.firefox.com"
    - "lens.l.google.com"
    - "localhost.ptlogin2.qq.com"
  # bootstrap: harus IP biasa (untuk me-resolve DoH/DoT dan server proxy)
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
  # DNS utama (DoH, kebal terhadap pembajakan DNS ISP / Internet Positif)
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # DNS untuk me-resolve domain server proxy
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # Kebijakan DNS per kategori (membutuhkan rule-providers di bawah)
  nameserver-policy:
    "rule-set:gs-category-ads-all": "rcode://success"
    "rule-set:gs-openai": "https://1.1.1.1/dns-query#AI-CHATGPT"
    "rule-set:gs-category-ai-not-cn": "https://1.1.1.1/dns-query#AI-CHATGPT"
    "rule-set:gs-telegram": "https://1.1.1.1/dns-query#TELEGRAM"
    "rule-set:gs-netflix": "https://1.1.1.1/dns-query#NETFLIX"
    "rule-set:gs-youtube": "https://1.1.1.1/dns-query#YOUTUBE"
  # Fallback bertingkat (dipakai jika hasil nameserver terindikasi terpolusi)
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.quad9.net/dns-query
    - https://dns.adguard-dns.com/dns-query
    - tls://dns.google:853
  fallback-filter:
    geoip: true
    geoip-code: ID
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/8
      - 127.0.0.0/8
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.githubusercontent.com"
      - "+.googlevideo.com"
      - "+.telegram.org"

proxies:

proxy-groups:
  # ---- Group utama ----
  - name: PILIH-PROXY
    type: select
    include-all-proxies: true
    exclude-filter: '(?i)traffic|expire|remaining|reset|website|sisa|kadaluarsa|官网|剩余|到期|流量|套餐|订阅'
    proxies:
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
      - "DIRECT"

  - name: AUTO-TERCEPAT
    type: url-test
    include-all-proxies: true
    exclude-filter: '(?i)traffic|expire|remaining|reset|website|sisa|kadaluarsa|官网|剩余|到期|流量|套餐|订阅'
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 30
    lazy: true

  - name: PROXY-FAILOVER
    type: fallback
    include-all-proxies: true
    exclude-filter: '(?i)traffic|expire|remaining|reset|website|sisa|kadaluarsa|官网|剩余|到期|流量|套餐|订阅'
    url: https://cp.cloudflare.com/generate_204
    interval: 200
    lazy: true

  - name: PROXY-LOADBALANCE
    type: load-balance
    strategy: consistent-hashing
    include-all-proxies: true
    exclude-filter: '(?i)traffic|expire|remaining|reset|website|sisa|kadaluarsa|官网|剩余|到期|流量|套餐|订阅'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    lazy: true

  # ---- Group layanan ----
  - name: ADBLOCK
    type: select
    proxies:
      - "REJECT"
      - "REJECT-DROP"
      - "DIRECT"
      - "PILIH-PROXY"

  - name: AI-CHATGPT
    type: select
    proxies:
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PILIH-PROXY"
      - "PROXY-LOADBALANCE"
      - "DIRECT"

  - name: TELEGRAM
    type: select
    proxies:
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
      - "DIRECT"

  - name: MESSENGER
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: TIKTOK-SOSMED
    type: select
    proxies:
      - "AUTO-TERCEPAT"
      - "PILIH-PROXY"
      - "DIRECT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: YOUTUBE
    type: select
    proxies:
      - "AUTO-TERCEPAT"
      - "PILIH-PROXY"
      - "DIRECT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: NETFLIX
    type: select
    proxies:
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"
      - "PROXY-LOADBALANCE"
      - "PROXY-FAILOVER"
      - "DIRECT"

  - name: STREAMING
    type: select
    proxies:
      - "PROXY-LOADBALANCE"
      - "AUTO-TERCEPAT"
      - "PILIH-PROXY"
      - "DIRECT"
      - "PROXY-FAILOVER"
  - name: STREAMING-LOKAL
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"

  - name: MUSIC
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: GAME
    type: select
    proxies:
      - "DIRECT"
      - "AUTO-TERCEPAT"
      - "PILIH-PROXY"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: CRYPTO-PAYMENT
    type: select
    proxies:
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"
      - "DIRECT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: DEVELOPER
    type: select
    proxies:
      - "PILIH-PROXY"
      - "DIRECT"
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: GOOGLE
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"
  - name: MICROSOFT
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"
      - "AUTO-TERCEPAT"

  - name: APPLE
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"

  - name: SPEEDTEST
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"

  - name: DOWNLOAD-TORRENT
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"

  - name: FINANSIAL-BANK
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"

  - name: E-COMMERCE
    type: select
    proxies:
      - "DIRECT"
      - "PILIH-PROXY"

  - name: LAINNYA
    type: select
    proxies:
      - "PILIH-PROXY"
      - "DIRECT"
      - "AUTO-TERCEPAT"
      - "PROXY-FAILOVER"
      - "PROXY-LOADBALANCE"

