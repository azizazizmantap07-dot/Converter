mixed-port: 7892
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
geodata-mode: false

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # Me-resolve domain server proxy. IP biasa (UDP) di depan agar tetap jalan di
  # jaringan terbatas/paket bug yang memblokir DoH; DoH sebagai cadangan.
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

proxies:

proxy-groups:
  - name: PILIH-PROXY
    type: select
    include-all-proxies: true
    proxies:
      - AUTO-TERCEPAT
      - DIRECT
  - name: AUTO-TERCEPAT
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,PILIH-PROXY
