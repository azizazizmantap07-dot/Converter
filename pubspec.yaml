name: proxy_converter
description: Offline converter for VMess, VLESS, and Trojan links to Clash Meta YAML and Sing-box JSON.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/template-clash-minimal.yaml
    - assets/templates/template-clash-lengkap.yaml
    - assets/templates/template-Singbox-minimal.json
    - assets/templates/template-Singbox-lengkap.json
