plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: reads android/key.properties (written by CI from GitHub Secrets,
// or created by hand for local builds). Falls back to debug signing if it's missing.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.proxyconverter.app"
    // Plugin (flutter_plugin_android_lifecycle dll.) butuh compileSdk 35 dan NDK 27;
    // Flutter 3.24.5 default-nya masih SDK 34 / NDK 23.
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.proxyconverter.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Hanya ARM 32 + ARM 64 — tanpa x86/x86_64 (ukuran APK lebih kecil)
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // Flutter's Gradle plugin turns on resource shrinking for release builds by default,
            // which fails when code shrinking (minify) is off. Keep both off explicitly.
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
